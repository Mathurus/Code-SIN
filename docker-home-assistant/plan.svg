<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="700" fill="#1e2327"/>

  <!-- Pièces -->
  <g stroke="#e8e4da" stroke-width="6" stroke-linejoin="round">
    <rect x="40"  y="40"  width="500" height="340" fill="#2b3238"/>  <!-- Salon -->
    <rect x="540" y="40"  width="420" height="260" fill="#303840"/>  <!-- Cuisine -->
    <rect x="540" y="300" width="420" height="140" fill="#2b3238"/>  <!-- Entrée -->
    <rect x="40"  y="380" width="500" height="280" fill="#303840"/>  <!-- Chambre -->
    <rect x="540" y="440" width="420" height="220" fill="#2b3238"/>  <!-- Salle de bain -->
  </g>

  <!-- Portes (ouvertures) -->
  <g stroke="#1e2327" stroke-width="10">
    <line x1="540" y1="150" x2="540" y2="230"/>
    <line x1="540" y1="330" x2="540" y2="410"/>
    <line x1="700" y1="440" x2="780" y2="440"/>
    <line x1="260" y1="380" x2="340" y2="380"/>
  </g>

  <!-- Meubles simples -->
  <g fill="#3d4750" stroke="#566370" stroke-width="2">
    <rect x="80"  y="70"  width="200" height="80" rx="12"/>   <!-- canapé -->
    <rect x="130" y="200" width="100" height="60" rx="8"/>    <!-- table basse -->
    <rect x="380" y="60"  width="130" height="50" rx="6"/>    <!-- meuble TV -->
    <rect x="580" y="70"  width="340" height="40" rx="6"/>    <!-- plan de travail -->
    <rect x="640" y="170" width="140" height="80" rx="8"/>    <!-- table -->
    <rect x="150" y="440" width="190" height="170" rx="10"/>  <!-- lit -->
    <rect x="70"  y="440" width="50"  height="170" rx="6"/>   <!-- armoire -->
    <rect x="580" y="480" width="110" height="60" rx="8"/>    <!-- baignoire -->
    <circle cx="880" cy="500" r="28"/>                        <!-- lavabo -->
  </g>

  <!-- Noms des pièces -->
  <g fill="#9aa5b1" font-size="26" font-weight="600" text-anchor="middle">
    <text x="290" y="355">Salon</text>
    <text x="750" y="280">Cuisine</text>
    <text x="750" y="425">Entrée</text>
    <text x="290" y="640">Chambre</text>
    <text x="750" y="640">Salle de bain</text>
  </g>
</svg>
